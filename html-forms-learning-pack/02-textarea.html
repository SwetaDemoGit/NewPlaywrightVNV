<!DOCTYPE html>
<html>

<head>
    <title>Text Area</title>
</head>

<body>
    <h1>Text Area</h1>
    <form>
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="5" cols="40" placeholder="Enter your address"></textarea>
        <br><br>
        <label for="feedback">Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="10" cols="40" placeholder="Enter your feedback"></textarea>
    </form>
</body>

</html>
