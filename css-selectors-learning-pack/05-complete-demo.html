<!DOCTYPE html>
<html>
<head>
    <title>Complete CSS Selectors Demo</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Type Selector */
        h1 {
            text-align: center;
        }

        /* ID Selector */
        #mainTitle {
            color: blue;
        }

        /* Class Selector */
        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1 id="mainTitle">CSS Selectors</h1>

    <p class="highlight">
        CSS selectors identify HTML elements.
    </p>

    <p>
        Type selectors use HTML tag names.
    </p>

    <p class="highlight">
        Class selectors can style multiple elements.
    </p>

</body>
</html>
