<!DOCTYPE html>
<html>

<head>
    <title>Universal Selector</title>
    <style>
        * {
            font-family: Arial;
        }
    </style>
</head>

<body>

    <h1>Universal Selector</h1>

    <p>The universal selector is represented by *.</p>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <button>Click Me</button>

</body>

</html>
