<!DOCTYPE html>
<html>
<head>
    <title>Type Selector</title>
    <style>
        p {
            color: blue;
            font-size: 18px;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Type Selector</h1>

<p>First paragraph styled using the p selector.</p>
<p>Second paragraph styled using the p selector.</p>

<h2>This heading is not affected by the p selector.</h2>

</body>
</html>
