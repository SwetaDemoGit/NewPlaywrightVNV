<!DOCTYPE html>
<html>

<head>
    <title>Text Transformation</title>
    <style>
        .upper {
            text-transform: uppercase
        }

        .lower {
            text-transform: lowercase
        }

        .title {
            text-transform: capitalize
        }
    </style>
</head>

<body>
    <h1>Text Transformation</h1>
    <p class="upper">hello world</p>
    <p class="lower">HELLO WORLD</p>
    <p class="title">hello world</p>
    <p>CSS changes the visual appearance; the original HTML text remains unchanged.</p>
</body>

</html>
