<!DOCTYPE html>
<html>

<head>
    <title>Line Height</title>
    <style>
        .content {
            line-height: 3.8;
            width: 500px
        }
    </style>
</head>

<body>
    <h1>Line Height</h1>
    <p class="content">CSS controls the appearance of web pages.<br>Proper line spacing improves readability.<br>Without
        increased line-height, the lines would appear closer together.</p>
</body>

</html>
