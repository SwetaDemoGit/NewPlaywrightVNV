<!DOCTYPE html>
<html>

<head>
    <title>Font Style</title>
    <style>
        .normal {
            font-style: normal
        }

        .italic {
            font-style: italic
        }

        .oblique {
            font-style: oblique
        }
    </style>
</head>

<body>
    <h1>Font Style</h1>
    <p class="normal">Normal Text</p>
    <p class="italic">Italic Text</p>
    <p class="oblique">Oblique Text</p>
</body>

</html>
