<html>

<head>

        .normal {
            font-weight: 400
        }

        .bold {
            font-weight: 1000
        }
    </style>
</head>

<body>

    <p class="normal">Normal Text</p>
    <p class="bold">Bold Text</p>
</body>

</html>
