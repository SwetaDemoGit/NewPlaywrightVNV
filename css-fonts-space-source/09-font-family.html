<!DOCTYPE html>
<html>

<head>
    <title>Font Family</title>
    <style>
        .serif {
            font-family: Georgia, serif
        }

        .sans {
            font-family: Arial, sans-serif
        }

        .mono {
            font-family: "Courier New", monospace
        }
    </style>
</head>

<body>
    <h1>Font Family</h1>
    <p class="serif">This is Serif text.</p>
    <p class="sans">This is Sans-serif text.</p>
    <p class="mono">This is Monospace text.</p>
</body>

</html>
