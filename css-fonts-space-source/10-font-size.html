<!DOCTYPE html>
<html>

<head>
    <title>Font Size</title>
    <style>
        .small {
            font-size: 14px
        }

        .large {
            font-size: 30px
        }

        .rem {
            font-size: 1.2rem
        }

        .percent {
            font-size: 200%
        }
    </style>
</head>

<body>
    <h1>Font Size</h1>
    <p class="small">Small Text</p>
    <p class="large">Large Text</p>
    <p class="rem">Text using rem</p>
    <p class="percent">Text using percentage</p>
</body>

</html>
