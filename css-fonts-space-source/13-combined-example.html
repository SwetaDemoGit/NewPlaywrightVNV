<!DOCTYPE html>
<html>

<head>
    <title>Combined CSS Example</title>
    <style>
        .course-title {
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px gray
        }

        .description {
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            text-align: justify;
            width: 600px
        }
    </style>
</head>

<body>
    <h1>Combined Example</h1>
    <h2 class="course-title">CSS Training</h2>
    <p class="description">Learn how CSS controls text formatting, text effects and fonts. The paragraph has increased
        line spacing and justified alignment.</p>
</body>

</html>
