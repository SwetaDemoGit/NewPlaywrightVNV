<!DOCTYPE html>
<html>

<head>
    <title>Text Alignment</title>
    <style>
        .left {
            text-align: left
        }

        .center {
            text-align: center
        }

        .right {
            text-align: right
        }

        .justify {
            text-align: justify;
            width: 500px
        }
    </style>
</head>

<body>
    <h1>Text Alignment</h1>
    <p class="left">Left aligned text</p>
    <p class="center">Center aligned text</p>
    <p class="right">Right aligned text</p>
    <p class="justify">CSS is used to control the presentation of HTML content. Justified text distributes the text so
        that both the left and right edges are aligned.</p>
</body>

</html>
