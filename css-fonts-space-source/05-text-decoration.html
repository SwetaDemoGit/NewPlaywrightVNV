<!DOCTYPE html>
<html>

<head>
    <title>Text Decoration</title>
    <style>
        .underline {
            text-decoration: underline
        }

        .overline {
            text-decoration: overline
        }

        .strike {
            text-decoration: line-through
        }

        .none {
            text-decoration: none
        }
    </style>
</head>

<body>
    <h1>Text Decoration</h1>
    <p class="underline">Important Text</p>
    <p class="overline">Overlined Text</p>
    <p class="strike">Old Price</p>
    <p><a class="none" href="#">Link without decoration</a></p>
</body>

</html>
