<!DOCTYPE html>
<html>

<head>
    <title>Text Indentation</title>
    <style>
        .intro {
            text-indent: 40px
        }
    </style>
</head>

<body>
    <h1>Text Indentation</h1>
    <p class="intro">CSS is used to control the presentation of HTML content. The first line starts 40 pixels from the
        normal starting position.</p>
</body>

</html>
