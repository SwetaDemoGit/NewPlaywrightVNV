<!DOCTYPE html>
<html>

<head>
    <title>Numbering Types</title>
</head>

<body>

    <h2>Numbers</h2>

    <ol type="1">
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
    </ol>


    <h2>Uppercase Letters</h2>

    <ol type="A">
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
    </ol>


    <h2>Lowercase Letters</h2>

    <ol type="a">
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
    </ol>


    <h2>Roman Numbers</h2>

    <ol type="I">
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
    </ol>

</body>

</html>
