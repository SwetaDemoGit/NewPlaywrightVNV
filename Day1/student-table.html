<!DOCTYPE html>
<html>

<head>

    <title>Student Report</title>

    <style>

        table {
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

    </style>

</head>

<body>

    <h1>Student Report</h1>

    <table>

        <tr>

            <th colspan="3">
                Student Marks
            </th>

        </tr>

        <tr>

            <th>Name</th>
            <th>Subject</th>
            <th>Score</th>

        </tr>

        <tr>

            <td rowspan="2">Rahul</td>
            <td>Java</td>
            <td>85</td>

        </tr>

        <tr>

            <td>HTML</td>
            <td>90</td>

        </tr>

        <tr>

            <td>Priya</td>
            <td>Python</td>
            <td>95</td>

        </tr>

    </table>

</body>

</html>
