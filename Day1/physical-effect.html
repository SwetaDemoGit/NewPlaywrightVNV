<!DOCTYPE html>
<html>

<head>
    <title>Character Effects</title>
</head>

<body>

    <h1>Character Effects</h1>

    <p>
        This is <b>bold text</b>.
    </p>

    <p>
        This is <i>italic text</i>.
    </p>

    <p>
        This is <u>underlined text</u>.
    </p>

    <p>
        This is <s>strikethrough text</s>.
    </p>

    <p>
        Water formula: H<sub>2</sub>O
    </p>

    <p>
        Mathematical example: X<sup>2</sup>
    </p>

</body>

</html>
