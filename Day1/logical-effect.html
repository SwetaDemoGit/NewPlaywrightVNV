<!DOCTYPE html>
<html>

<head>
    <title>Logical Character Effects</title>
</head>

<body>

    <h1>Logical Character Effects</h1>

    <p>
        <strong>Warning:</strong>
        Save your work before closing the application.
    </p>

    <p>
        This is <em>very important</em> information.
    </p>

    <p>
        Learn <mark>HTML5 semantic elements</mark>
        carefully.
    </p>

    <p>
        <small>Terms and conditions apply.</small>
    </p>

    <p>
        Original price:
        <del>₹20,000</del>
    </p>

    <p>
        Discounted price:
        <ins>₹15,000</ins>
    </p>

</body>

</html>
