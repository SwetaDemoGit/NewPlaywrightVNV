<!DOCTYPE html>
<html>

<head>
       <title>Complete HTML5 Demo</title>
</head>

<body>

       <h1>HTML5 Features Demo</h1>

       <h2>Registration Form</h2>

       <form>

              <label for="name">Name:</label>
              <input type="text" id="name" name="name">

              <br><br>

              <label for="dob">Date of Birth:</label>
              <input type="date" id="dob" name="dob">

              <br><br>

              <label for="age">Age:</label>
              <input type="number" id="age" name="age" min="18" max="60">

              <br><br>

              <label for="experience">Experience:</label>
              <input type="range" id="experience" name="experience" min="0" max="20" value="2">

              <br><br>

              <label for="email">Email:</label>
              <input type="email" id="email" name="email">

              <br><br>

              <label for="search">Search:</label>
              <input type="search" id="search" name="search">

              <br><br>

              <label for="browser">Browser:</label>
              <input list="browsers" id="browser" name="browser">

              <datalist id="browsers">
                     <option value="Chrome">
                     <option value="Firefox">
                     <option value="Edge">
                     <option value="Safari">
              </datalist>

              <br><br>

              <button type="submit">Submit</button>

       </form>

       <hr>

       <article>

              <h2>HTML5 Multimedia</h2>

              <p>HTML supports native audio and video elements.</p>

              <h3>Audio</h3>

              <audio controls>
                     <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                     Your browser does not support the audio element.
              </audio>

              <h3>Video</h3>

              <video controls width="500" poster="images/video-poster.svg">
                     <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                     Your browser does not support the video element.
              </video>

       </article>

</body>

</html>
