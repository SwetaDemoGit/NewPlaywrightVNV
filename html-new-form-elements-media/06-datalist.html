<!DOCTYPE html>
<html>

<head>
    <title>Datalist</title>
</head>

<body>
    <h1>Datalist</h1>
    <form>
        <label for="browser">Choose a browser:</label>
        <input list="browsers" id="browser" name="browser">

        <datalist id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Edge">
            <option value="Safari">
        </datalist>
    </form>
</body>

</html>
