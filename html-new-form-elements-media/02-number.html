<!DOCTYPE html>
<html>

<head>
       <title>Number Input</title>
</head>

<body>
       <h1>Number Input</h1>
       <form>
              <label for="age">Age:</label>
              <input type="number" id="age" name="age" min="18" max="60">
              <br><br>
              <label for="quantity">Quantity:</label>
              <input type="number" id="quantity" name="quantity" min="1" max="10" step="1">
       </form>
</body>

</html>
