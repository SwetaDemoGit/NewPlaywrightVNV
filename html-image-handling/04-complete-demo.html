<!DOCTYPE html>
<html>
<head>
    <title>Image Handling Demo</title>
</head>
<body>

    <h1>Student Training Portal</h1>

    <h2>Our Training</h2>

    <img src="images/classroom.svg"
         alt="Technology training classroom"
         width="500">

    <h2>Programming</h2>

    <p>Images can be used to visually represent courses and concepts.</p>

    <img src="images/coding.svg"
         alt="Student learning programming"
         width="350">

    <h2>Useful Website</h2>

    <p>Click the image to visit Google.</p>

    <a href="https://www.google.com" target="_blank">
        <img src="images/google-link.svg"
             alt="Open Google"
             width="250">
    </a>

</body>
</html>
