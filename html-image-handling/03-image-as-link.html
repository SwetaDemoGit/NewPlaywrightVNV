<!DOCTYPE html>
<html>
<head>
    <title>Image as Hyperlink</title>
</head>
<body>

    <h1>Using an Image as a Hyperlink</h1>

    <p>Click the image below to open Google.</p>

    <a href="https://www.google.com" target="_blank">
        <img src="images/google-link.svg"
             alt="Click to open Google"
             width="250">
    </a>

</body>
</html>
