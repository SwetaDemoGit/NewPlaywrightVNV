<!DOCTYPE html>
<html>
<head>
<title>Complete CSS Demo</title>

<link rel="stylesheet" href="complete-style.css">

<style>
    .internal-message {
        color: purple;
        font-size: 20px;
    }
</style>

</head>
<body>

<h1>Introduction to CSS</h1>

<p class="external-message">
This paragraph is styled using external CSS.
</p>

<p class="internal-message">
This paragraph is styled using internal CSS.
</p>

<p style="color: red; font-size: 22px;">
This paragraph is styled using inline CSS.
</p>

<h2>What CSS Can Do</h2>

<div class="demo-box">
CSS can control color, fonts, borders, spacing and more.
</div>

</body>
</html>
