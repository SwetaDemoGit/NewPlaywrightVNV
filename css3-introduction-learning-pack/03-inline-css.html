<!DOCTYPE html>
<html>

<head>
    <title>Inline CSS</title>
</head>

<body>

    <h1 style="color: red;">Inline CSS Example</h1>

    <p style="color: blue; font-size: 20px;">

    <p>
        Only the elements containing the style attribute receive these styles.
    </p>
