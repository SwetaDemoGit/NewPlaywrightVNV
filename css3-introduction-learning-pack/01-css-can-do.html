<!DOCTYPE html>
<html>

<head>
    <title>What CSS Can Do</title>
</head>

<body>

    <h1 style="color: blue;">CSS Can Change Text Color</h1>

    <p style="background-color: yellow;">
        CSS can change the background color.
    </p>

    <p style="font-size: 24px;">
        CSS can change font size.
    </p>

    <p style="font-family: Arial;">
        CSS can change the font family.
    </p>

    <p style="border: 2px solid black;">
        CSS can add a border.
    </p>

    <p style="margin: 20px; padding: 10px; border: 1px solid black;">
        CSS can control spacing using margin and padding.
    </p>

</body>

</html>
