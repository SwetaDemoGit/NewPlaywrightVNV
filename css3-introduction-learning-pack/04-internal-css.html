<!DOCTYPE html>
<html>
<head>
<title>Internal CSS</title>

<style>
h1 {
    color: purple;
}

p {
    color: green;
    font-size: 18px;
}
</style>

</head>
<body>

<h1>Internal CSS Example</h1>

<p>This paragraph is styled using the style element.</p>
<p>Both paragraphs receive the same CSS rule.</p>

</body>
</html>
